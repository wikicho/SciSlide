name: Publish the requested SciSlide 0.6.1 release

# This bootstrap applies only to the explicitly requested 0.6.1 publication.
# Normal source pushes and future version changes cannot publish a release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.6.1.yml

permissions: {}

concurrency:
  group: scislide-publish-0.6.1-bootstrap
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'wikicho/SciSlide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Dispatch the existing verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-release-061.mjs
